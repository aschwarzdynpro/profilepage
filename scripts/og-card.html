<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Manrope";font-weight:400 800;src:url(../assets/fonts/manrope-latin.woff2) format("woff2")}
  @font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(../assets/fonts/plex-latin.woff2) format("woff2")}
  *{margin:0;padding:0;box-sizing:border-box}
  /* Magazin-Bild wie die Site: Papier, Schwarz, Rot als Akzent, Doppellinien. */
  body{width:1200px;height:630px;background:#fbfaf7;color:#1a1a1a;font-family:"IBM Plex Sans",sans-serif;position:relative;overflow:hidden}
  .mark{display:flex;align-items:center;gap:14px;font-family:"Manrope",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;
    position:absolute;top:44px;left:88px;right:88px;padding-bottom:22px;border-bottom:3px double #1a1a1a}
  .mark svg{width:36px;height:36px}
  .mark small{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#7a766f;margin-left:auto}
  .card{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:140px 88px 110px}
  .kicker{font-family:"Manrope",sans-serif;font-weight:700;font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#b5342b}
  h1{font-family:"Manrope",sans-serif;font-weight:800;font-size:56px;line-height:1.04;letter-spacing:-.03em;margin:20px 0 24px;max-width:19ch}
  p{font-size:26px;line-height:1.45;color:#444;max-width:48ch;font-weight:300}
  .foot{position:absolute;bottom:52px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:center;
    font-size:22px;color:#7a766f;border-top:1px solid #1a1a1a;padding-top:22px}
  .foot b{color:#1a1a1a;font-family:"Manrope",sans-serif;font-weight:700}
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 26 26" fill="none"><rect x="3" y="3" width="8" height="8" fill="#b5342b"/><rect x="15" y="3" width="8" height="8" stroke="#1a1a1a" stroke-width="1.6"/><rect x="3" y="15" width="8" height="8" stroke="#1a1a1a" stroke-width="1.6"/><rect x="15" y="15" width="8" height="8" stroke="#1a1a1a" stroke-width="1.6"/></svg>
    DynamicsPro
    <small id="tag">Profil</small>
  </div>
  <div class="card">
    <div class="kicker" id="kicker">Freiberuflich · Nürnberg und DACH-Raum</div>
    <h1 id="title">Solution Architect für Dynamics 365 Sales, Customer Service und Field Service.</h1>
    <p id="sub">Architektur, ALM und Code. 16 Jahre Dynamics-Stack.</p>
  </div>
  <div class="foot">
    <span><b>Andy Schwarz</b> · Freelancer, Nürnberg</span>
    <span>dynamicspro.de</span>
  </div>
  <script>
    // Varianten je Seite: scripts/og.mjs ruft die Karte mit ?kicker=…&title=…&sub=…&tag=… auf.
    var q = new URLSearchParams(location.search);
    ['kicker', 'title', 'sub', 'tag'].forEach(function (k) {
      if (q.has(k)) document.getElementById(k).textContent = q.get(k);
    });
  </script>
</body>
</html>
