name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht parallel fahren.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Nur ausliefern, was zur Site gehoert. CLAUDE.md, README.md,
      # package.json und scripts/ bleiben damit aus dem Web heraus.
      - name: Site-Dateien einsammeln
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -r assets _site/assets
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
